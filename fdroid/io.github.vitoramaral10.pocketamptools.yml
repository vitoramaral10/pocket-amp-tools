Builds:
  - versionName: 0.3.0
    versionCode: 1003
    commit: 4d2a213b78d1dd76fd70e40a74c2e1fb210caa0a
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - linux
      - macos
      - windows
      - test
      - test_hardware
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\ '(.*)'/\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --dart-define=SENTRY_DSN=https://8c7abe2a014e101d473d76ca114ec196@o4511829580709888.ingest.us.sentry.io/4512418973548544
    ndk: r28c

