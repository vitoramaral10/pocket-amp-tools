AntiFeatures:
  NonFreeNet:
    en-US: The "Download from M-VAVE" button fetches the pedal firmware from M-VAVE's
      server; the firmware is not free software.
  Tracking:
    en-US: Crash and update reports go to Sentry, only after the user agrees (off
      by default).
