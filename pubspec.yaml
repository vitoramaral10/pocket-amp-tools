name: pocket_amp_tools
description: "Preset editor and firmware updater for the Pocket AMP guitar pedal (M-VAVE, Donner, Coolmusic PIXIE1, New Bee SK17), over USB-MIDI and Bluetooth."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.13.5

dependencies:
  bluez: ^0.8.3
  crypto: ^3.0.7
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_midi_command: ^1.4.0
  flutter_svg: ^2.3.4
  http: ^1.6.0
  path_provider: ^2.1.6
  sentry_flutter: ^10.3.0
  universal_ble: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/blocks/
